<text x="64" y="122"><tspan fill="#f5813f">export</tspan><tspan fill="#f5813f">&#160;async&#160;function&#160;</tspan><tspan fill="#f2b04a" font-weight="600">kindle</tspan><tspan fill="#c2b5ab">(</tspan><tspan fill="#efcfa2">heat</tspan><tspan fill="#ab9c90">:&#160;</tspan><tspan fill="#e3c27e" font-style="italic">number</tspan><tspan fill="#c2b5ab">)&#160;{</tspan></text>
