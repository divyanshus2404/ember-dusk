<text x="64" y="78"><tspan fill="#e08aa0">import</tspan><tspan fill="#ab9c90">&#160;{&#160;</tspan><tspan fill="#e3c27e">Ember</tspan><tspan fill="#ab9c90">&#160;}&#160;</tspan><tspan fill="#e08aa0">from</tspan><tspan fill="#a9c46c">&#160;"./fire"</tspan><tspan fill="#ab9c90">;</tspan></text>
